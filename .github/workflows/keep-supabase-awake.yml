# Supabase 무료 요금제는 7일 동안 아무도 쓰지 않으면 서버가 멈춥니다(일시정지).
# 멈추면 로그인도, 고객 공유 링크도 열리지 않습니다.
# 그래서 매일 한 번 서버에 가볍게 신호를 보내 깨어 있게 합니다.
name: Supabase 깨어 있게 하기

on:
  schedule:
    - cron: '0 3 * * *'        # 매일 UTC 03:00 (한국 낮 12시)
  workflow_dispatch:           # 깃허브에서 손으로 눌러 바로 확인할 수도 있습니다

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: 서버에 신호 보내기
        run: |
          URL=$(sed -n "s/.*SUPABASE_URL: '\([^']*\)'.*/\1/p" config.js)
          KEY=$(sed -n "s/.*SUPABASE_KEY: '\([^']*\)'.*/\1/p" config.js)
          if [ -z "$URL" ] || [ -z "$KEY" ]; then
            echo "::error::config.js 에서 주소와 키를 읽지 못했습니다"
            exit 1
          fi
          echo "주소: $URL"
          CODE=$(curl -s -o /dev/null -w "%{http_code}" --max-time 30 \
            -H "apikey: $KEY" -H "Authorization: Bearer $KEY" \
            "$URL/rest/v1/records?select=id&limit=1")
          echo "응답 코드: $CODE"
          if [ "$CODE" = "000" ]; then
            echo "::error::서버에 연결하지 못했습니다. https://supabase.com/dashboard 에서 이 프로젝트가 멈춰 있는지(Paused) 확인하고 Restore(다시 시작) 를 눌러주세요."
            exit 1
          fi
          echo "서버가 살아 있습니다 (응답 $CODE)"

      # 깃허브는 저장소에 60일 동안 사람이 올린 변경이 없으면 이 자동 작업을 꺼버립니다.
      # 그 전에 미리 알려주기 위해, 45일이 넘으면 일부러 실패시켜 메일이 가게 합니다.
      - name: 자동 작업이 꺼지기 전에 미리 알리기
        run: |
          LAST=$(git log -1 --format=%ct)
          DAYS=$(( ( $(date +%s) - LAST ) / 86400 ))
          echo "마지막 변경 이후 ${DAYS}일 지남"
          if [ "$DAYS" -gt 45 ]; then
            echo "::error::저장소에 ${DAYS}일째 변경이 없습니다. 60일이 지나면 깃허브가 이 자동 깨우기 작업을 꺼버립니다. 아무 변경이나 한 번 올리거나, Actions 탭에서 이 작업을 직접 한 번 실행해주세요."
            exit 1
          fi
